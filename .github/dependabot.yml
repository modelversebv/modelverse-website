# Monthly minor and patch updates as one grouped pull request per ecosystem.
# Versions younger than 7 days are skipped; major versions are updated by hand.
version: 2
updates:
  # npm packages of the site
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "(build)"

  # Actions in .github/workflows, pinned to a commit SHA with the version as a comment
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "(ci)"
